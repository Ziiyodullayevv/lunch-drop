; LunchDrop — cron/scheduler (APScheduler) alohida jarayon.
; Joylashuv:  /etc/supervisor/conf.d/lunchdrop-scheduler.conf
; Status o'tishlari (1 daqiqa) + invoicing (kunlik 23:59).
; MUHIM: faqat BITTA jarayon — uvicorn workerlarida ishlamaydi (takrorlanmaslik uchun).

[program:lunchdrop-scheduler]
command=/home/lunchdrop/venv/bin/python -m app.workers.scheduler
directory=/home/lunchdrop
user=lunchdrop
environment=PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/lunchdrop-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
