; LunchDrop — supervisor konfiguratsiyasi.
; Serverda joylashuvi:  /etc/supervisor/conf.d/lunchdrop.conf
; Qayta o'qish:  sudo supervisorctl reread && sudo supervisorctl update

[program:lunchdrop]
command=/home/lunchdrop/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/home/lunchdrop
user=lunchdrop
; .env shu 'directory' dan o'qiladi (pydantic-settings). Bayt-kod yozilmasin (read-only kod):
environment=PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/lunchdrop.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
