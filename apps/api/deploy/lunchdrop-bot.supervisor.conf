; LunchDrop Telegram approval bot — faqat bitta polling process ishlashi kerak.

[program:lunchdrop-bot]
command=/home/lunchdrop/venv/bin/python -m bot.main
directory=/home/lunchdrop
user=lunchdrop
environment=PYTHONDONTWRITEBYTECODE="1"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/lunchdrop-bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
