name: API CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'infra/api.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'infra/api.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-cd.yml'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      JWT_PRIVATE_KEY_PATH: keys/private.pem
      JWT_PUBLIC_KEY_PATH: keys/public.pem
      ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m compileall app bot alembic
      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No API tests directory yet; skipping pytest."
          fi

  docker:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: image
        name: Prepare image name
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/lunchdrop-api" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
