name: Web CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Web CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare web deploy directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/launch-drop-admin

      - name: Upload web compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/web.yml
          target: /opt/launch-drop-admin
          strip_components: 1

      - name: Deploy web to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            cd /opt/launch-drop-admin
            test -f .env || { echo "/opt/launch-drop-admin/.env is missing"; exit 1; }
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Use the stable API domain instead of a droplet IP so replacing
            # the API server cannot silently break the web proxy.
            NEXT_SERVER_API_URL="https://api.lunchdrop.uz" \
              NEXT_PUBLIC_SERVER_URL="https://api.lunchdrop.uz" \
              WEB_IMAGE="ghcr.io/${OWNER}/lunchdrop-web:latest" docker compose -f web.yml pull
            NEXT_SERVER_API_URL="https://api.lunchdrop.uz" \
              NEXT_PUBLIC_SERVER_URL="https://api.lunchdrop.uz" \
              WEB_IMAGE="ghcr.io/${OWNER}/lunchdrop-web:latest" docker compose -f web.yml up -d
            docker image prune -f
