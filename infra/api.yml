services:
  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/lunchdrop-api:latest}
    container_name: lunchdrop-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
      - ./media:/app/media
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    image: ${API_IMAGE:-ghcr.io/OWNER/lunchdrop-api:latest}
    container_name: lunchdrop-scheduler
    restart: unless-stopped
    command: ['python', '-m', 'app.workers.scheduler']
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
      - ./media:/app/media
